[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "live2d-automation"
version = "0.1.0"
description = "Verification-first Cubism automation CLI, Skill and stdio MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp>=1.26,<2", "websockets>=15,<17", "pydantic>=2.10,<3", "platformdirs>=4,<5", "filelock>=3.18,<4", "psutil>=7,<8", "pyyaml>=6,<7", "pywin32>=311; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.11", "mypy>=1.15", "build>=1.2"]

[project.scripts]
live2d-automation = "live2d_automation.cli:main"
live2d-automation-mcp = "live2d_automation.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/live2d_automation"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_editor: opt-in test requiring a running, approved real Cubism Editor"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
